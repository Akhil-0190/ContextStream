<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ContextStream</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>✳ ContextStream</h1>
    <p id="status">Ready when you are.</p>
    <button id="analyze" type="button">Explore this frame</button>
    <button id="session" class="secondary" type="button">Watch with ContextStream</button>
    <a id="profile" href="http://localhost:8080/#preferences" target="_blank" rel="noopener noreferrer">Your preferences ↗</a>
    <details class="more-options">
      <summary>More options</summary>
      <label class="share-option"><input id="share-cache" type="checkbox"> Help improve discoveries for this video</label>
      <small id="cache-status">Checking availability…</small>
    </details>
    <details class="developer-options">
      <summary>Local setup</summary>
      <form id="server-form">
        <label for="server-url">Service address</label>
        <input id="server-url" type="url" placeholder="http://localhost:8080" autocomplete="url">
        <button class="secondary" type="submit">Save</button>
      </form>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
